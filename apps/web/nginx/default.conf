# Menyajikan dist/ hasil Vite. TLS dan domain urusan proxy di depan
# (Caddy/Cloudflare Tunnel); di sini cukup HTTP polos di port 8080.
#
# Header keamanan ditulis ulang di setiap location lewat include, karena
# add_header di dalam location MENGHAPUS semua add_header dari server{} —
# jebakan nginx yang membuat header hilang diam-diam di path tertentu.

server_tokens off;

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;

    # sw.js, index.html, manifest, dan registerSW.js tidak berhash. Kalau
    # di-cache browser atau CDN, petugas tertahan di versi lama: service worker
    # tidak pernah melihat sw.js baru dan precache tidak diperbarui.
    location = /sw.js {
        include /etc/nginx/snippets/header-aman.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /registerSW.js {
        include /etc/nginx/snippets/header-aman.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/header-aman.conf;
        add_header Cache-Control "no-cache" always;
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Nama berkas di assets/ dan workbox-*.js berhash isi: aman disimpan lama.
    location /assets/ {
        include /etc/nginx/snippets/header-aman.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ~ ^/workbox-[0-9a-f]+\.js$ {
        include /etc/nginx/snippets/header-aman.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA: path yang tidak ada jatuh ke index.html, dan index.html tidak
    # pernah di-cache supaya selalu menunjuk aset berhash yang terbaru.
    location / {
        include /etc/nginx/snippets/header-aman.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
