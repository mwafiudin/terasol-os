# Dipasang di setiap location default.conf. CSP sengaja belum: aplikasi
# memuat Google Fonts dan memanggil API di origin lain, jadi CSP yang benar
# butuh VITE_API_URL dan perlu diuji di browser, bukan ditebak di sini.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
